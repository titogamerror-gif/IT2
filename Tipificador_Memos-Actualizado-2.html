<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tipificador de Memos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4;
  --surface:#FFFFFF;
  --surface-2:#F5F7F9;
  --ink:#1B2430;
  --muted:#5B6B7A;
  --line:#DCE2E7;
  --accent:#0E7C61;
  --accent-ink:#063D30;
  --danger:#B23A48;
  --hfc:#B4703A;
  --gpon:#0F8B8D;
  --dth:#5B4B8A;
  --cobre:#8C6239;
  --casos:#B23A48;
  --gen:#516079;
  --radius:10px;
  --shadow:0 1px 2px rgba(27,36,48,.06), 0 4px 14px rgba(27,36,48,.06);
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;
  min-height:100vh;
}
.mono{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;}

/* ---- top bar ---- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px;
  gap:16px;
}
.topbar .brand{display:flex; align-items:baseline; gap:10px;}
.topbar .brand h1{font-size:1.15rem; font-weight:800; margin:0; letter-spacing:.2px;}
.topbar .brand span{font-size:.8rem; color:#9BA9B8;}
.rfield{display:flex; align-items:center; gap:8px;}
.rfield label{font-size:.8rem; color:#9BA9B8; font-weight:600;}
.rfield input{
  background:#26313F; border:1px solid #3A4756; color:#fff;
  border-radius:8px; padding:8px 10px; font-size:.95rem; width:150px;
  font-family:'JetBrains Mono',monospace;
}
.rfield input:focus{outline:2px solid var(--accent); outline-offset:1px;}
.rfield .hint{font-size:.72rem; color:#7C8998;}

/* ---- category tabs ---- */
.cattabs{
  display:flex; gap:4px; padding:10px 22px 0 22px; background:var(--surface);
  border-bottom:1px solid var(--line); overflow-x:auto;
}
.cattab{
  padding:12px 16px; border:none; background:transparent; cursor:pointer;
  font-family:inherit; font-weight:700; font-size:.92rem; color:var(--muted);
  border-bottom:3px solid transparent; white-space:nowrap;
  transition:color .15s;
}
.cattab:hover{color:var(--ink);}
.cattab.active{color:var(--ink);}
.cattab .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; vertical-align:middle;}

/* ---- layout ---- */
.wrap{max-width:1180px; margin:0 auto; padding:20px 22px 60px;}
.layout{display:grid; grid-template-columns:300px 1fr; gap:20px; align-items:start;}
@media (max-width:880px){ .layout{grid-template-columns:1fr;} }

.panel{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}

/* step pills */
.steps{display:flex; gap:6px; margin-bottom:14px;}
.step{
  flex:1; text-align:center; padding:9px 8px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface-2); cursor:pointer; font-weight:700; font-size:.85rem; color:var(--muted);
}
.step.active{background:var(--catcolor,var(--accent)); color:#fff; border-color:transparent;}

.suborders{display:flex; flex-direction:column; gap:6px;}
.suborder-btn{
  text-align:left; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); cursor:pointer; font-family:inherit;
}
.suborder-btn:hover{border-color:var(--catcolor,var(--accent));}
.suborder-btn.active{border-color:var(--catcolor,var(--accent)); background:color-mix(in srgb, var(--catcolor,var(--accent)) 8%, white);}
.suborder-btn .lbl{display:block; font-weight:700; font-size:.9rem; color:var(--ink);}
.suborder-btn .code{display:block; font-size:.76rem; color:var(--muted); margin-top:2px; font-family:'JetBrains Mono',monospace;}

/* form */
.formhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.formhead h2{font-size:1.05rem; margin:0;}
.formhead .code-chip{
  font-family:'JetBrains Mono',monospace; font-size:.78rem; background:var(--surface-2);
  border:1px solid var(--line); padding:3px 9px; border-radius:20px; color:var(--muted);
}
.form-empty{color:var(--muted); padding:40px 10px; text-align:center; font-size:.95rem;}

.section-hdr{
  margin:18px 0 8px; padding-top:10px; border-top:1px dashed var(--line);
  font-size:.78rem; font-weight:800; letter-spacing:.03em; color:var(--catcolor,var(--accent));
}
.section-hdr:first-child{border-top:none; margin-top:0; padding-top:0;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:.82rem; font-weight:600; color:var(--muted); margin-bottom:5px;}
.field input[type=text], .field textarea, .field select{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  font-family:inherit; font-size:.92rem; background:#fff; color:var(--ink);
}
.field textarea{min-height:70px; resize:vertical; font-family:'JetBrains Mono',monospace; font-size:.85rem;}
.field input:focus, .field textarea:focus, .field select:focus{
  outline:none; border-color:var(--catcolor,var(--accent)); box-shadow:0 0 0 3px color-mix(in srgb, var(--catcolor,var(--accent)) 18%, transparent);
}

.tvblock{border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:14px; background:var(--surface-2);}
.tvblock .tvhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.tvblock .tvhead strong{font-size:.85rem;}
.countpicker{display:flex; gap:5px;}
.countpicker button{
  width:30px; height:30px; border-radius:6px; border:1px solid var(--line); background:#fff;
  cursor:pointer; font-weight:700; font-family:inherit; font-size:.85rem;
}
.countpicker button.active{background:var(--catcolor,var(--accent)); color:#fff; border-color:transparent;}

.opt-list{display:flex; gap:6px; flex-wrap:wrap;}
.opt-btn{
  padding:8px 16px; border-radius:20px; border:1px solid var(--line); background:#fff;
  cursor:pointer; font-weight:700; font-family:inherit; font-size:.85rem; color:var(--muted);
}
.opt-btn:hover{border-color:var(--catcolor,var(--accent));}
.opt-btn.active{background:var(--catcolor,var(--accent)); color:#fff; border-color:transparent;}
.tv-inputs{display:grid; gap:8px;}

.actions{display:flex; gap:10px; margin-top:18px;}
.btn{
  padding:11px 18px; border-radius:8px; border:none; cursor:pointer; font-weight:700;
  font-family:inherit; font-size:.92rem;
}
.btn-primary{background:var(--catcolor,var(--accent)); color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
.validation{color:var(--danger); font-size:.82rem; margin-top:8px; font-weight:600;}

.output-wrap{margin-top:18px; border-top:1px solid var(--line); padding-top:16px;}
.output-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.output-head h3{font-size:.9rem; margin:0; color:var(--muted);}
.output{
  background:#0F1720; color:#D9E4EC; border-radius:8px; padding:16px;
  white-space:pre-wrap; font-size:.86rem; line-height:1.55; max-height:520px; overflow:auto;
}
.copied-toast{font-size:.8rem; color:var(--accent); font-weight:700; opacity:0; transition:opacity .2s;}
.copied-toast.show{opacity:1;}

.casos-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px;}
.caso-card{
  border:1px solid var(--line); border-radius:8px; padding:14px; cursor:pointer; background:#fff;
}
.caso-card:hover{border-color:var(--casos);}
.caso-card.active{border-color:var(--casos); background:color-mix(in srgb, var(--casos) 8%, white);}
.caso-card .lbl{font-weight:700; font-size:.92rem;}

.transform-panel{margin-bottom:16px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:14px;}
.transform-panel summary{font-weight:800;cursor:pointer;}
.transform-panel p{font-size:.82rem;color:var(--muted);margin:8px 0 10px;}
.transform-panel textarea{width:100%;min-height:110px;padding:10px;border:1px solid var(--line);border-radius:8px;font: .85rem 'JetBrains Mono',monospace;resize:vertical;}
.transform-panel .actions{margin-top:10px;}
.output-editor{width:100%;min-height:160px;background:#0F1720;color:#D9E4EC;border:0;border-radius:8px;padding:16px;white-space:pre-wrap;font: .86rem/1.55 'JetBrains Mono',monospace;resize:vertical;}
.footnote{font-size:.78rem; color:var(--muted); margin-top:22px; text-align:center;}
.wallpaper-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.wallpaper-tools .btn{padding:8px 10px;font-size:.78rem;white-space:nowrap;}
.wallpaper-tools input[type=file]{display:none;}
body.has-wallpaper{background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;}
@media(max-width:760px){.topbar{align-items:flex-start;flex-wrap:wrap;padding:12px}.topbar .brand{flex-wrap:wrap}.wallpaper-tools{width:100%;}}

</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><h1>Tipificador de Memos</h1><span>HFC · GPON · DTH · COBRE · Casos</span></div>
  <div class="rfield">
    <label for="rInput">DESPACHO / R</label>
    <input id="rInput" type="text" placeholder="ej. R1196" autocomplete="off">
  </div>
  <div class="wallpaper-tools">
    <button class="btn btn-secondary" type="button" id="wallpaperBtn">🖼️ Fondo de pantalla</button>
    <input type="file" id="wallpaperFile" accept="image/*">
    <button class="btn btn-secondary" type="button" id="removeWallpaperBtn" title="Quitar fondo">Quitar fondo</button>
  </div>
</div>

<div class="cattabs" id="cattabs"></div>

<div class="wrap" id="wrap"></div>

<script>
(function(){
'use strict';

const CATS = [
  {id:'HFC', label:'HFC', color:'var(--hfc)'},
  {id:'GPON', label:'GPON', color:'var(--gpon)'},
  {id:'DTH', label:'DTH', color:'var(--dth)'},
  {id:'COBRE', label:'COBRE', color:'var(--cobre)'},
  {id:'CASOS', label:'Casos', color:'var(--casos)'},
  {id:'GENERALES', label:'Memos generales', color:'var(--gen)'},
];
const STEP_LABEL = {ACTIVACION:'Activación', CONFIRMACION:'Confirmación'};

const state = {
  cat: 'HFC',
  step: null,
  suborderIdx: 0,
  itemIdx: 0,
  values: {},
  tvCounts: {},
};

const rInput = document.getElementById('rInput');
rInput.value = localStorage.getItem('tipificador_r') || '';
rInput.addEventListener('input', () => {
  localStorage.setItem('tipificador_r', rInput.value);
});

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function currentColorVar(){
  const c = CATS.find(c=>c.id===state.cat);
  return c ? c.color : 'var(--accent)';
}

function getTechList(catId){
  return TPL_DATA.TECH[catId] || null;
}

function currentTechEntry(){
  const list = getTechList(state.cat);
  if (!list) return null;
  const step = state.step || Object.keys(list)[0];
  const arr = list[step] || [];
  return arr[state.suborderIdx] || null;
}

function currentFlatEntry(){
  const arr = TPL_DATA[state.cat] || [];
  return arr[state.itemIdx] || null;
}

// ---------------- rendering ----------------

function renderCatTabs(){
  const el = document.getElementById('cattabs');
  el.innerHTML = '';
  CATS.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'cattab' + (state.cat===c.id ? ' active' : '');
    btn.style.borderBottomColor = state.cat===c.id ? c.color : 'transparent';
    btn.innerHTML = `<span class="dot" style="background:${c.color}"></span>${esc(c.label)}`;
    btn.onclick = () => {
      state.cat = c.id;
      state.step = null;
      state.suborderIdx = 0;
      state.itemIdx = 0;
      // Conserva los datos al cambiar de categoría para reutilizarlos en otra plantilla.
      state.tvCounts = {};
      renderAll();
    };
    el.appendChild(btn);
  });
}

function normalizeKey(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
}

function collectFieldAliases(entry, aliases){
  (entry.fields||[]).forEach(f=>{
    const names = [f.label, f.id.replace(/_/g,' '), f.prefix||''];
    names.forEach(n=>{
      const key=normalizeKey(String(n).replace(/:$/,''));
      if(key && key.length>1 && !aliases[key]) aliases[key]=f.id;
    });
  });
  (entry.rows||[]).forEach(r=>{
    if(r.kind==='field' && r.id){
      const key=normalizeKey(String(r.label||r.id).replace(/:$/,''));
      if(key && !aliases[key]) aliases[key]=r.id;
      const pk=normalizeKey(String(r.prefix||'').replace(/:$/,''));
      if(pk && !aliases[pk]) aliases[pk]=r.id;
    }
    if(r.kind==='channel' && r.id){
      aliases[normalizeKey('ID LLAMADA')]=r.id;
      aliases[normalizeKey('ID')]=r.id;
    }
  });
}

function allFieldAliases(){
  const aliases={};
  const addEntry=e=>collectFieldAliases(e,aliases);
  Object.values(TPL_DATA.TECH).forEach(cat=>Object.values(cat).forEach(arr=>arr.forEach(addEntry)));
  (TPL_DATA.CASOS||[]).forEach(addEntry);
  (TPL_DATA.GENERALES||[]).forEach(addEntry);
  return aliases;
}

function renderTransformPanel(parent){
  const details=document.createElement('details');
  details.className='transform-panel';
  const summary=document.createElement('summary');
  summary.textContent='Transformar un memo existente';
  details.appendChild(summary);
  const help=document.createElement('p');
  help.textContent='Primero selecciona la plantilla destino. Pega aquí el memo anterior y pulsa “Importar datos”: se reconocerán las líneas con formato CAMPO: valor y se rellenarán los campos compatibles sin borrar los demás datos.';
  details.appendChild(help);
  const area=document.createElement('textarea');
  area.placeholder='Pega aquí el memo anterior…';
  area.value=state.pastedMemo||'';
  area.addEventListener('input',()=>{state.pastedMemo=area.value;});
  details.appendChild(area);
  const actions=document.createElement('div'); actions.className='actions';
  const btn=document.createElement('button'); btn.className='btn btn-primary'; btn.textContent='Importar datos al formulario actual';
  const status=document.createElement('span'); status.style.cssText='font-size:.82rem;color:var(--muted);align-self:center;';
  btn.onclick=()=>{
    const raw=area.value.trim();
    if(!raw){status.textContent='Pega primero un memo.';return;}
    const entry=getTechList(state.cat)?currentTechEntry():currentFlatEntry();
    if(!entry){status.textContent='Selecciona primero una plantilla destino.';return;}
    const aliases=allFieldAliases();
    const targetFields={};
    const targetMeta=[];
    (entry.fields||[]).forEach(f=>{
      const names=[f.label,f.id.replace(/_/g,' '),f.prefix||''];
      names.forEach(n=>{const k=normalizeKey(String(n).replace(/:$/,''));if(k)targetFields[k]=f.id;});
      targetMeta.push({id:f.id,label:normalizeKey(f.label+' '+f.id.replace(/_/g,' '))});
    });
    (entry.rows||[]).forEach(r=>{if(r.kind==='field'&&r.id){const names=[r.label,r.id.replace(/_/g,' '),r.prefix||''];names.forEach(n=>{const k=normalizeKey(String(n).replace(/:$/,''));if(k)targetFields[k]=r.id;});targetMeta.push({id:r.id,label:normalizeKey((r.label||'')+' '+r.id.replace(/_/g,' '))});}});
    // Variantes habituales de los campos que suelen cambiar de nombre entre memos.
    const aliasGroups=[
      {keys:['TELEFONO CLIENTE','TELEFONO DEL CLIENTE','NUMERO DE TELEFONO DEL CLIENTE','NUMERO TELEFONICO CLIENTE','TEL CLIENTE','TEL DE CLIENTE','TELEFONO DE CONTACTO','NUMERO AL QUE CONFIRMA'],test:x=>/(TEL|TELEFONO|NUMERO AL QUE CONFIRMA)/.test(x)&&/(CLIENTE|CONTACTO|CONFIRMA)/.test(x)},
      {keys:['CODIGO TECNICO','CODIGO DEL TECNICO','ID TECNICO','ID DEL TECNICO','CODIGO Y NOMBRE TECNICO','CODIGO TECNICO Y NOMBRE TECNICO'],test:x=>/(CODIGO|ID) TECNICO/.test(x)||/(CODIGO|ID) DEL TECNICO/.test(x)}
    ];
    aliasGroups.forEach(g=>{const t=targetMeta.find(x=>g.test(x.label));if(t)g.keys.forEach(k=>{if(!targetFields[k])targetFields[k]=t.id;});});
    let matched=0;
    raw.split(/\r?\n/).forEach(line=>{
      const m=line.match(/^\s*([^:]{2,100})\s*:\s*(.*?)\s*$/);
      if(!m)return;
      const key=normalizeKey(m[1]);
      let id=targetFields[key] || (aliases[key] && (entry.fields||[]).some(f=>f.id===aliases[key]) ? aliases[key] : null);
      if(!id && /^(TEL|TELEFONO|NUMERO TELEFONICO)/.test(key)) id=targetFields['TELEFONO CLIENTE']||targetFields['TEL DE CLIENTE']||targetFields['NUMERO AL QUE CONFIRMA']||null;
      if(!id && /^(CODIGO|ID)( DEL)? TECNICO/.test(key)) id=targetFields['CODIGO TECNICO']||targetFields['ID TECNICO']||targetFields['CODIGO TECNICO Y NOMBRE TECNICO']||null;
      if(id && m[2]){state.values[id]=m[2];matched++;}
      if(targetFields[normalizeKey('Canal de contacto')]){
        if(/^ID LLAMADA$/i.test(key)) state.values['canal_contacto__mode']='LLAMADA';
        if(/^ID$/i.test(key) && /^CHAT$/i.test(m[2])) state.values['canal_contacto__mode']='CHAT';
      }
    });
    state.pastedMemo=raw;
    renderAll();
    const panel=document.querySelector('.transform-panel'); if(panel)panel.open=true;
    const newStatus=document.createElement('p'); newStatus.style.cssText='font-size:.82rem;color:var(--accent);font-weight:700;margin:8px 0 0;';
    newStatus.textContent=matched ? `Se importaron ${matched} campo(s) compatibles. Revisa el formulario y genera el memo.` : 'No se encontraron campos compatibles. Puedes copiar manualmente la información al formulario.';
    const current=document.querySelector('.transform-panel'); if(current) current.appendChild(newStatus);
  };
  actions.appendChild(btn); actions.appendChild(status); details.appendChild(actions);
  parent.appendChild(details);
}

function renderFormPanel(container, entry){
  const head = document.createElement('div');
  head.className = 'formhead';

  const fieldsById = {};
  (entry.fields||[]).forEach(f=>{ fieldsById[f.id] = f; });

  const formBody = document.createElement('div');
  let sawDespacho = false;

  entry.rows.forEach(row=>{
    if (row.kind === 'blank') return;

    if (row.kind === 'static'){
      const disp = row.text.replace(/^[\*\-_]+|[\*\-_]+$/g,'').trim();
      if (disp){
        const h = document.createElement('div');
        h.className = 'section-hdr';
        h.textContent = disp;
        formBody.appendChild(h);
      }
      return;
    }

    if (row.kind === 'despacho'){
      if (!sawDespacho){
        sawDespacho = true;
        const note = document.createElement('div');
        note.style.cssText = 'font-size:.78rem;color:var(--muted);margin:4px 0 10px;';
        note.textContent = 'Se completa automáticamente con el campo R de arriba.';
        formBody.appendChild(note);
      }
      return;
    }

    if (row.kind === 'channel'){
      formBody.appendChild(renderChannelEl(row.id));
      return;
    }

    if (row.kind === 'field'){
      formBody.appendChild(renderFieldEl(row.id, row.label, row.input||'text', row.options, row.placeholder, row.default));
      return;
    }

    if (row.kind === 'templated'){
      row.fieldIds.forEach(fid=>{
        const meta = fieldsById[fid];
        if (!meta) return;
        formBody.appendChild(renderFieldEl(meta.id, meta.label, meta.input||'text', meta.options, meta.placeholder, meta.default));
      });
      return;
    }

    if (row.kind === 'tvgroup'){
      formBody.appendChild(renderTvGroupEl(row));
      return;
    }
  });

  container.appendChild(formBody);

  // actions
  const actions = document.createElement('div');
  actions.className = 'actions';
  const genBtn = document.createElement('button');
  genBtn.className = 'btn btn-primary';
  genBtn.textContent = 'Generar memo';
  const validation = document.createElement('div');
  validation.className = 'validation';

  const outputWrap = document.createElement('div');
  outputWrap.className = 'output-wrap';
  outputWrap.style.display = 'none';
  const outHead = document.createElement('div');
  outHead.className = 'output-head';
  outHead.innerHTML = `<h3>Memo generado</h3>`;
  const copyBtn = document.createElement('button');
  copyBtn.className = 'btn btn-secondary';
  copyBtn.textContent = 'Copiar';
  const toast = document.createElement('span');
  toast.className = 'copied-toast';
  toast.textContent = 'Copiado ✓';
  const headRight = document.createElement('div');
  headRight.style.cssText = 'display:flex;align-items:center;gap:10px;';
  headRight.appendChild(toast);
  headRight.appendChild(copyBtn);
  outHead.appendChild(headRight);
  const outputEl = document.createElement('textarea');
  outputEl.className = 'output-editor mono';
  outputEl.setAttribute('aria-label','Memo generado editable');
  outputWrap.appendChild(outHead);
  outputWrap.appendChild(outputEl);

  genBtn.onclick = () => {
    const R = rInput.value.trim();
    if (!R && entry.id !== 'memo_informativo'){
      validation.textContent = 'Ingresa el campo R / despacho arriba antes de generar.';
      rInput.focus();
      return;
    }
    validation.textContent = '';
    const body = generateText(entry.rows, state.values, state.tvCounts, R);
    const text = entry.id === 'memo_informativo' ? body : '*-*\n' + body;
    outputEl.value = text;
    outputWrap.style.display = 'block';
    outputWrap.scrollIntoView({behavior:'smooth', block:'nearest'});
  };

  copyBtn.onclick = () => {
    navigator.clipboard.writeText(outputEl.value).then(()=>{
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'), 1400);
    });
  };

  actions.appendChild(genBtn);
  container.appendChild(actions);
  container.appendChild(validation);
  container.appendChild(outputWrap);
}

function renderFieldEl(id, label, input, options, placeholder, defaultVal){
  if (input === 'coord_dms'){
    const suffix = (defaultVal && defaultVal.slice(-1)) || 'N';
    return renderCoordMaskField(id, label, suffix);
  }
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const lab = document.createElement('label');
  lab.setAttribute('for', 'f_'+id);
  lab.textContent = label;
  wrap.appendChild(lab);

  if (input === 'select' || input === 'multiselect'){
    if (input==='select' && defaultVal && state.values[id] === undefined) state.values[id] = defaultVal;
    if (input==='multiselect' && state.values[id] === undefined) state.values[id] = [];
    const list = document.createElement('div');
    list.className = 'opt-list';
    list.id = 'f_'+id;
    const isActive = (op) => input==='multiselect'
      ? (state.values[id]||[]).includes(op)
      : state.values[id]===op;
    (options||[]).forEach(op=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt-btn' + (isActive(op) ? ' active' : '');
      b.textContent = op;
      b.onclick = () => {
        if (input === 'multiselect'){
          const arr = state.values[id] || [];
          const idx = arr.indexOf(op);
          if (idx >= 0) arr.splice(idx,1); else arr.push(op);
          state.values[id] = arr;
          b.classList.toggle('active');
        } else {
          state.values[id] = (state.values[id]===op) ? undefined : op;
          [...list.children].forEach(c=>c.classList.remove('active'));
          if (state.values[id]===op) b.classList.add('active');
        }
      };
      list.appendChild(b);
    });
    wrap.appendChild(list);
    return wrap;
  }

  let el;
  if (input === 'textarea'){
    el = document.createElement('textarea');
    if (placeholder) el.placeholder = placeholder;
  } else {
    el = document.createElement('input');
    el.type = 'text';
    if (placeholder) el.placeholder = placeholder;
    if (defaultVal) { el.value = defaultVal; state.values[id] = state.values[id] ?? defaultVal; }
  }
  el.id = 'f_'+id;
  if (state.values[id] !== undefined) el.value = state.values[id];
  el.addEventListener('input', ()=>{ state.values[id] = el.value; });
  wrap.appendChild(el);
  return wrap;
}

// Masked coordinate input: 00°00'00.00"N — only the 8 digit slots are editable,
// the ° ' . " and trailing N/O are fixed and the cursor skips over them automatically.
const COORD_DIGIT_POS = [0,1,3,4,6,7,9,10];

function buildCoordString(digits, suffix){
  return `${digits[0]}${digits[1]}°${digits[2]}${digits[3]}'${digits[4]}${digits[5]}.${digits[6]}${digits[7]}"${suffix}`;
}

function nearestDigitSlot(caret){
  for (let i=0;i<COORD_DIGIT_POS.length;i++){
    if (COORD_DIGIT_POS[i] >= caret) return i;
  }
  return COORD_DIGIT_POS.length - 1;
}

function renderCoordMaskField(id, label, suffix){
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const lab = document.createElement('label');
  lab.setAttribute('for', 'f_'+id);
  lab.textContent = label;
  wrap.appendChild(lab);

  const el = document.createElement('input');
  el.type = 'text';
  el.id = 'f_'+id;
  el.className = 'mono';
  el.inputMode = 'numeric';

  let digits = state.values[id+'__digits'] || ['0','0','0','0','0','0','0','0'];

  function commit(){
    const str = buildCoordString(digits, suffix);
    el.value = str;
    state.values[id] = str;
    state.values[id+'__digits'] = digits;
  }
  commit();

  function placeCaret(pos){
    requestAnimationFrame(()=>el.setSelectionRange(pos,pos));
  }

  el.addEventListener('keydown', (e)=>{
    if (e.key === 'Tab' || e.metaKey || e.ctrlKey || e.key === 'ArrowUp' || e.key === 'ArrowDown') return;
    e.preventDefault();
    const caret = el.selectionStart;
    if (e.key >= '0' && e.key <= '9'){
      const di = nearestDigitSlot(caret);
      digits[di] = e.key;
      commit();
      const nextDi = di + 1;
      placeCaret(nextDi < COORD_DIGIT_POS.length ? COORD_DIGIT_POS[nextDi] : COORD_DIGIT_POS[di] + 1);
    } else if (e.key === 'Backspace'){
      let idx = -1;
      for (let i=COORD_DIGIT_POS.length-1;i>=0;i--){
        if (COORD_DIGIT_POS[i] < caret){ idx = i; break; }
      }
      if (idx >= 0){
        digits[idx] = '0';
        commit();
        placeCaret(COORD_DIGIT_POS[idx]);
      }
    } else if (e.key === 'ArrowLeft'){
      const di = Math.max(0, nearestDigitSlot(caret) - (COORD_DIGIT_POS[nearestDigitSlot(caret)] >= caret ? 1 : 0));
      placeCaret(COORD_DIGIT_POS[di]);
    } else if (e.key === 'ArrowRight'){
      const di = Math.min(COORD_DIGIT_POS.length-1, nearestDigitSlot(caret) + 1);
      placeCaret(COORD_DIGIT_POS[di]);
    }
  });
  el.addEventListener('click', ()=>{
    const caret = el.selectionStart;
    placeCaret(COORD_DIGIT_POS[nearestDigitSlot(caret)]);
  });
  el.addEventListener('focus', ()=>{ placeCaret(COORD_DIGIT_POS[0]); });

  wrap.appendChild(el);
  return wrap;
}

// ---------------- memo text generation ----------------

function isEmptyValue(val){
  if (Array.isArray(val)) return val.length === 0;
  return val === undefined || val === null || String(val).trim() === '';
}

function generateText(rows, values, tvCounts, R){
  const out = [];
  for (const r of rows){
    switch(r.kind){
      case 'blank': break; // no empty lines in the generated memo
      case 'static': out.push(r.text); break;
      case 'despacho': out.push(r.prefix + (R||'')); break;
      case 'channel': {
        const mode = values[r.id+'__mode'];
        if (mode === 'CHAT'){
          out.push('ID: CHAT');
        } else if (mode === 'LLAMADA'){
          const val = values[r.id];
          if (!isEmptyValue(val)) out.push('ID LLAMADA: ' + val);
        }
        break;
      }
      case 'field': {
        if (r.input === 'coord_dms'){
          const digits = values[r.id+'__digits'];
          const touched = digits && digits.some(d => d !== '0');
          if (!touched) break;
          out.push((r.prefix||'') + (values[r.id] ?? r.default ?? ''));
        } else {
          const val = values[r.id];
          if (isEmptyValue(val)) break;
          const printVal = Array.isArray(val) ? val.join(', ') : val;
          out.push((r.prefix||'') + printVal);
        }
        break;
      }
      case 'templated': {
        const allEmpty = r.fieldIds.every(fid => isEmptyValue(values[fid]));
        if (allEmpty) break;
        let line = r.raw;
        for (const fid of r.fieldIds){
          const v = values[fid];
          const printVal = Array.isArray(v) ? v.join(', ') : (v ?? '');
          line = line.split('@@FIELD:'+fid+'@@').join(printVal);
        }
        out.push(line);
        break;
      }
      case 'tvgroup': {
        const n = tvCounts[r.groupId] ?? 1;
        for (let i=0;i<n;i++){
          const val = values[r.groupId+'_'+i];
          if (isEmptyValue(val)) continue;
          out.push(r.prefix + val);
        }
        break;
      }
    }
  }
  return out.join('\n');
}

wallpaperFile.addEventListener('change',()=>{
  const file=wallpaperFile.files&&wallpaperFile.files[0];if(!file)return;
  if(!file.type.startsWith('image/')){alert('Elige un archivo de imagen.');return;}
  const reader=new FileReader();reader.onload=()=>{
    const img=new Image();img.onload=()=>{
      try{
        const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        const data=canvas.toDataURL('image/jpeg',.82);applyWallpaper(data);
        try{localStorage.setItem('tipificadorWallpaper',data);}catch(e){alert('El fondo se aplicó, pero el navegador no permitió guardarlo para la próxima vez.');}
      }catch(e){applyWallpaper(reader.result);alert('El fondo se aplicó, pero no se pudo guardar una versión optimizada.');}
    };img.onerror=()=>alert('No se pudo abrir esa imagen. Prueba con otra.');img.src=reader.result;
  };reader.readAsDataURL(file);wallpaperFile.value='';
});
removeWallpaperBtn.addEventListener('click',()=>{applyWallpaper('');try{localStorage.removeItem('tipificadorWallpaper');}catch(e){};});
})();

</script>
</body>
</html>
